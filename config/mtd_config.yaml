mtd:
  enabled: true
  rotation_policy: round-robin      # round-robin | random | adaptive
  rotation_interval: 10             # rotate every N queries
  batch_size: 5                     # retriever switches every N queries
  kb_pool:
    - data/knowledge_bases/kb_clean/
    - data/knowledge_bases/kb_rotated/snapshot_1/
    - data/knowledge_bases/kb_rotated/snapshot_2/
  kb_pool_size: 3
  retrieval_sequence:
    - dense
    - sparse
    - hybrid
  embed_models:
    - sentence-transformers/all-MiniLM-L6-v2
    - BAAI/bge-small-en-v1.5
  ensemble_vote_threshold: 0.6
  embed_rotation_interval: 10       # rotate embedding model every N queries
  anomaly_detection:
    enabled: false
    sigma_threshold: 2.0
    window_size: 50
