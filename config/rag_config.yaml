rag:
  chunk_size: 256
  chunk_overlap: 32
  top_k: 5
  retrieval_strategy: dense         # dense | sparse | hybrid
  hybrid_alpha: 0.5                 # weight for dense score in hybrid
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  llm_provider: extractive          # extractive | llama_cpp
  llm_model_path: models/tinyllama-1.1b-q4.gguf
  llm_n_ctx: 2048
  llm_n_threads: 4
  llm_seed: 42
  max_tokens: 256
  temperature: 0.0                  # deterministic for reproducibility
  context_max_chars: 3000           # hard truncate context to avoid overflow
  index_path: data/index/
  results_path: data/results/
  logs_path: logs/
  narr_enabled: true                # compute NARR in extended evaluator
  faithfulness_eval: true           # compute RAGChecker faithfulness metrics
