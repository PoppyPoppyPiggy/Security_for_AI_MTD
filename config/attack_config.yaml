attack:
  type: poisoned_rag                # poisoned_rag | corpus_poison | indirect
  num_poison_docs: 5                # matches PoisonedRAG paper (Zou 2025)
  target_queries_path: data/attack_corpus/target_queries.json
  target_answer: "INJECTED_ANSWER"
  kb_clean_path: data/knowledge_bases/kb_clean/
  kb_poisoned_path: data/knowledge_bases/kb_poisoned/
  attacker_level: L1                # L0 | L1 | L2 | L3
  injection_ratio: 0.0004           # 0.04% corpus poisoning ratio
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  optimized_sim_threshold: 0.85     # target similarity for optimized strategy
  retrieval_sim_threshold: 0.70     # min similarity for retrieval injection
